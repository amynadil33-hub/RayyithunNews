      content="Independent news from the Maldives, covering current affairs, business, education, religion, innovation, world news, and community stories."
    />

      href="/rayyithun-logo-transparent-v2.png"
    />
    <link rel="apple-touch-icon" href="/rayyithun-logo-transparent-v2.png" />
    <meta property="og:title" content="RAYYITHUN — The Voice of the Maldives" />
    <meta
      property="og:description"
      content="Independent news and stories from the Maldives."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/rayyithun-logo-transparent-v2.png" />

      rel="stylesheet"
      crossorigin
    />
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>
    <link href="/src/index.css" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
